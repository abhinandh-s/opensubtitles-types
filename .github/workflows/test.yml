name: Test

on:
  push:
    paths:
      - 'src/**'
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-commit:
    name: Test Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Test Api
        run: cargo test


